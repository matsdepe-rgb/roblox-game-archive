<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Game Archive</title>
    <link rel="icon" href="data:,">
    <style>
        :root { --rbx-blue: #00A2FF; --bg: #1a1a1a; --card-bg: #2a2a2a; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; }
        header { text-align: center; padding: 40px 0; }
        .search-container { max-width: 600px; margin: 0 auto 40px; position: relative; }
        #searchBar { width: 100%; padding: 15px; border-radius: 25px; border: none; font-size: 16px; outline: none; background: #333; color: white; }
        
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .game-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; transition: transform 0.2s; cursor: pointer; text-decoration: none; color: white; border: 1px solid #333; display: flex; flex-direction: column; }
        .game-card:hover { transform: translateY(-5px); border-color: var(--rbx-blue); }
        .game-icon { width: 100%; aspect-ratio: 1/1; background: #333; object-fit: cover; }
        .game-info { padding: 15px; flex-grow: 1; }
        .game-title { font-weight: bold; margin: 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .game-id { font-size: 12px; color: #888; margin-top: 5px; }
        .loader { text-align: center; color: var(--rbx-blue); font-weight: bold; margin-top: 50px; }
    </style>
</head>
<body>

<header>
    <h1>🛠️ Roblox Game Archive</h1>
    <p>Educational repository for studying game frameworks and logic.</p>
</header>

<div class="search-container">
    <input type="text" id="searchBar" placeholder="Search by Game Name or ID..." onkeyup="filterGames()">
</div>

<div id="loader" class="loader">Loading Repository Files...</div>
<div class="game-grid" id="gameGrid"></div>

<script>
    // --- CONFIGURATION ---
    const GITHUB_USER = 'matsdepe-rgb';
    const GITHUB_REPO = 'roblox-game-archive';
    const BRANCH = 'main'; 

    const proxy = "https://corsproxy.io/?"; 
    const githubApiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/Games`;
    let allGames = [];

    // This ensures the script waits for the HTML to load before running
    document.addEventListener('DOMContentLoaded', () => {
        init();
    });

    async function init() {
        const loader = document.getElementById('loader');
        try {
            const response = await fetch(githubApiUrl);
            const files = await response.json();
            
            if (!Array.isArray(files)) {
                loader.innerText = "Error: 'Games' folder not found or API limit reached.";
                return;
            }

            const gameIds = files
                .filter(f => f.name.endsWith('.rbxlx'))
                .map(f => f.name.replace('.rbxlx', ''));

            if (gameIds.length === 0) {
                loader.innerText = "No .rbxlx files found in /Games.";
                return;
            }

            await fetchRobloxData(gameIds);
        } catch (e) {
            loader.innerText = "Failed to load GitHub data.";
            console.error(e);
        }
    }

    async function fetchRobloxData(ids) {
        try {
            const idString = ids.join(',');
            
            // 1. Get Icons
            const iconsUrl = `https://thumbnails.roblox.com/v1/places/gameicons?placeIds=${idString}&size=512x512&format=Png&isCircular=false`;
            const iconsRes = await fetch(`${proxy}${encodeURIComponent(iconsUrl)}`);
            const iconsData = await iconsRes.json();

            // 2. Get Names
            const gameDataPromises = ids.map(async (id) => {
                let foundName = `Game ${id}`;
                
                try {
                    // Using Economy API for public names
                    const detailUrl = `https://economy.roblox.com/v2/assets/${id}/details`;
                    const detailRes = await fetch(`${proxy}${encodeURIComponent(detailUrl)}`);
                    const detail = await detailRes.json();
                    
                    if (detail.Name) {
                        foundName = detail.Name;
                    }
                } catch (err) {
                    console.warn(`Could not fetch name for ID ${id}`);
                }

                const iconObj = iconsData.data ? iconsData.data.find(i => i.targetId == id) : null;
                
                return {
                    id: id,
                    name: foundName,
                    icon: iconObj ? iconObj.imageUrl : 'https://tr.rbxcdn.com/53ebcb1015f850c890184e908f61537e/420/420/Image/Png',
                    downloadUrl: `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${BRANCH}/Games/${id}.rbxlx`
                };
            });

            allGames = await Promise.all(gameDataPromises);
            document.getElementById('loader').style.display = 'none';
            renderGames(allGames);

        } catch (err) {
            console.error("Roblox API Error:", err);
            document.getElementById('loader').innerText = "Error fetching Roblox data.";
        }
    }

    function renderGames(games) {
        const grid = document.getElementById('gameGrid');
        grid.innerHTML = games.map(game => `
            <a href="${game.downloadUrl}" class="game-card" download="${game.name}.rbxlx">
                <img class="game-icon" src="${game.icon}" onerror="this.src='https://tr.rbxcdn.com/53ebcb1015f850c890184e908f61537e/420/420/Image/Png'">
                <div class="game-info">
                    <p class="game-title">${game.name}</p>
                    <p class="game-id">ID: ${game.id}</p>
                </div>
            </a>
        `).join('');
    }

    // This needs to be global for the HTML onkeyup to see it
    window.filterGames = function() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const filtered = allGames.filter(g => 
            g.name.toLowerCase().includes(query) || g.id.toString().includes(query)
        );
        renderGames(filtered);
    }
</script>

</body>
</html>
